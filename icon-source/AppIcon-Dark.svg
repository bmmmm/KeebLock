<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Sleepy night background: indigo → plum → midnight -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2a2156"/>
      <stop offset="55%"  stop-color="#1a1638"/>
      <stop offset="100%" stop-color="#0c0a1c"/>
    </linearGradient>

    <linearGradient id="bgSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#a8a0ff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>

    <!-- Keycap skirt (dusky plum) -->
    <linearGradient id="capSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a5e8e"/>
      <stop offset="55%"  stop-color="#4d3960"/>
      <stop offset="100%" stop-color="#241a32"/>
    </linearGradient>

    <!-- Keycap face (warm cream stays — keeps heart legible) -->
    <linearGradient id="capFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6ead0"/>
      <stop offset="55%"  stop-color="#e6d6b2"/>
      <stop offset="100%" stop-color="#bda47c"/>
    </linearGradient>

    <linearGradient id="capFaceGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>

    <!-- Heart padlock (rose, slightly cooler for night) -->
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff95c6"/>
      <stop offset="55%"  stop-color="#e0568f"/>
      <stop offset="100%" stop-color="#7d2a55"/>
    </linearGradient>

    <linearGradient id="heartGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>

    <!-- Shackle (cool silver) -->
    <linearGradient id="shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8ecf2"/>
      <stop offset="55%"  stop-color="#a8b0bc"/>
      <stop offset="100%" stop-color="#5e6470"/>
    </linearGradient>

    <!-- Brush handle (dusky lilac wood) -->
    <linearGradient id="brushHandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#caa6cc"/>
      <stop offset="55%"  stop-color="#8c6694"/>
      <stop offset="100%" stop-color="#4a2e54"/>
    </linearGradient>

    <linearGradient id="bristle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e6dccd"/>
      <stop offset="100%" stop-color="#a08a70"/>
    </linearGradient>

    <radialGradient id="capShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bubble" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9bb6ff" stop-opacity="0.45"/>
    </radialGradient>

    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%"  stop-color="#fff8d0"/>
      <stop offset="100%" stop-color="#f0d875"/>
    </radialGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgSheen)"/>

  <!-- Crescent moon (upper-left), made by masking a circle with another circle -->
  <g>
    <mask id="crescentMask">
      <rect x="0" y="0" width="1024" height="1024" fill="black"/>
      <circle cx="178" cy="220" r="78" fill="white"/>
      <circle cx="208" cy="200" r="68" fill="black"/>
    </mask>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#moon)" mask="url(#crescentMask)"/>
    <!-- Soft moon glow -->
    <circle cx="178" cy="220" r="106" fill="#fff4b0" opacity="0.10"/>
  </g>

  <!-- Stars (4-pointed, varying brightness) -->
  <g fill="#fff8d8">
    <path d="M 858 196 l 8 -36 l 8 36 l 36 8 l -36 8 l -8 36 l -8 -36 l -36 -8 z" opacity="0.95"/>
    <path d="M 116 612 l 6 -28 l 6 28 l 28 6 l -28 6 l -6 28 l -6 -28 l -28 -6 z" opacity="0.85"/>
    <path d="M 886 740 l 10 -44 l 10 44 l 44 10 l -44 10 l -10 44 l -10 -44 l -44 -10 z" opacity="0.90"/>
    <path d="M 760 880 l 5 -22 l 5 22 l 22 5 l -22 5 l -5 22 l -5 -22 l -22 -5 z" opacity="0.75"/>
    <path d="M 220 880 l 6 -26 l 6 26 l 26 6 l -26 6 l -6 26 l -6 -26 l -26 -6 z" opacity="0.75"/>
    <!-- Tiny pin-prick stars -->
    <circle cx="312" cy="158" r="3" opacity="0.85"/>
    <circle cx="616" cy="124" r="2.5" opacity="0.75"/>
    <circle cx="940" cy="376" r="3" opacity="0.85"/>
    <circle cx="60"  cy="380" r="2.5" opacity="0.70"/>
    <circle cx="980" cy="900" r="3" opacity="0.80"/>
  </g>

  <!-- Bubbles (cleaning foam, moonlit) -->
  <g>
    <circle cx="146" cy="450" r="40" fill="url(#bubble)"/>
    <circle cx="142" cy="442" r="10" fill="#ffffff" opacity="0.85"/>

    <circle cx="900" cy="430" r="32" fill="url(#bubble)"/>
    <circle cx="896" cy="424" r="8" fill="#ffffff" opacity="0.85"/>

    <circle cx="208" cy="208" r="22" fill="url(#bubble)"/>
    <circle cx="204" cy="204" r="6" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Drop shadow under keycap -->
  <ellipse cx="512" cy="892" rx="296" ry="22" fill="url(#capShadow)"/>

  <!-- Keycap skirt -->
  <rect x="200" y="328" width="624" height="552" rx="92" ry="92" fill="url(#capSide)"/>
  <rect x="200" y="328" width="624" height="552" rx="92" ry="92"
        fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Keycap top face -->
  <rect x="258" y="364" width="508" height="436" rx="68" ry="68" fill="url(#capFace)"/>
  <rect x="258" y="364" width="508" height="436" rx="68" ry="68" fill="url(#capFaceGloss)"/>

  <!-- Heart padlock — shackle behind heart -->
  <path d="M 446 580
           L 446 502
           A 66 66 0 0 1 578 502
           L 578 580"
        fill="none" stroke="url(#shackle)" stroke-width="34" stroke-linecap="round"/>
  <path d="M 446 588
           L 446 502
           A 66 66 0 0 1 578 502
           L 578 588"
        fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="34" stroke-linecap="round"
        stroke-dasharray="0 26 8 1000"/>

  <!-- Heart body -->
  <path d="M 512 778
           C 512 778, 354 678, 354 568
           C 354 506, 408 478, 446 504
           C 472 522, 494 554, 512 580
           C 530 554, 552 522, 578 504
           C 616 478, 670 506, 670 568
           C 670 678, 512 778, 512 778 Z"
        fill="url(#heart)"/>
  <path d="M 512 778
           C 512 778, 354 678, 354 568
           C 354 506, 408 478, 446 504
           C 472 522, 494 554, 512 580
           C 530 554, 552 522, 578 504
           C 616 478, 670 506, 670 568
           C 670 678, 512 778, 512 778 Z"
        fill="url(#heartGloss)" opacity="0.65"/>
  <path d="M 512 778
           C 512 778, 354 678, 354 568
           C 354 506, 408 478, 446 504
           C 472 522, 494 554, 512 580
           C 530 554, 552 522, 578 504
           C 616 478, 670 506, 670 568
           C 670 678, 512 778, 512 778 Z"
        fill="none" stroke="#3a0e26" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Sleepy face -->
  <!-- Blush -->
  <ellipse cx="412" cy="650" rx="28" ry="16" fill="#ff7aa7" opacity="0.55"/>
  <ellipse cx="612" cy="650" rx="28" ry="16" fill="#ff7aa7" opacity="0.55"/>
  <!-- Closed sleepy eyes (u   u) — soft downward curves -->
  <path d="M 442 612 q 22 24 44 0" fill="none" stroke="#2a0e1e" stroke-width="10" stroke-linecap="round"/>
  <path d="M 538 612 q 22 24 44 0" fill="none" stroke="#2a0e1e" stroke-width="10" stroke-linecap="round"/>
  <!-- Tiny "o" sleeping mouth -->
  <ellipse cx="512" cy="668" rx="9" ry="11" fill="#2a0e1e"/>

  <!-- Floating Zzz above the heart -->
  <g fill="#fff8d8" font-family="Helvetica, Arial, sans-serif" font-weight="bold" opacity="0.95">
    <text x="660" y="490" font-size="44" transform="rotate(-12 660 490)">z</text>
    <text x="700" y="442" font-size="58" transform="rotate(-10 700 442)">z</text>
    <text x="752" y="380" font-size="78" transform="rotate(-8 752 380)">Z</text>
  </g>

  <!-- Cleaning brush sweeping in from upper-right (cooler tones) -->
  <g transform="translate(720,250) rotate(40)">
    <rect x="-30" y="-220" width="60" height="280" rx="30" ry="30" fill="url(#brushHandle)"/>
    <rect x="-30" y="-220" width="60" height="280" rx="30" ry="30"
          fill="none" stroke="#241032" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="-44" y="48" width="88" height="22" rx="6" fill="#a8aeb6"/>
    <rect x="-44" y="48" width="88" height="22" rx="6"
          fill="none" stroke="#3e424a" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M -54 70 L 54 70 L 70 152 L -70 152 Z" fill="url(#bristle)"/>
    <path d="M -54 70 L 54 70 L 70 152 L -70 152 Z"
          fill="none" stroke="#5a4a30" stroke-opacity="0.6" stroke-width="2"/>
    <g stroke="#7a6840" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round">
      <line x1="-46" y1="80"  x2="-58" y2="148"/>
      <line x1="-22" y1="80"  x2="-28" y2="148"/>
      <line x1="0"   y1="80"  x2="0"   y2="148"/>
      <line x1="22"  y1="80"  x2="28"  y2="148"/>
      <line x1="46"  y1="80"  x2="58"  y2="148"/>
    </g>
  </g>

  <!-- Tiny crumbs/dust drifting off -->
  <g fill="#caa56a" opacity="0.75">
    <circle cx="844" cy="300" r="6"/>
    <circle cx="868" cy="346" r="4"/>
    <circle cx="804" cy="262" r="5"/>
  </g>

  <!-- Foreground sparkles on the keycap face -->
  <g fill="#ffffff">
    <path d="M 312 414 l 5 -22 l 5 22 l 22 5 l -22 5 l -5 22 l -5 -22 l -22 -5 z" opacity="0.95"/>
    <path d="M 700 754 l 4 -18 l 4 18 l 18 4 l -18 4 l -4 18 l -4 -18 l -18 -4 z" opacity="0.85"/>
  </g>
</svg>
