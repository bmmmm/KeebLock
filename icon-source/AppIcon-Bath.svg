<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#cbeafe"/>
      <stop offset="50%"  stop-color="#a8dff0"/>
      <stop offset="100%" stop-color="#c8f2e0"/>
    </linearGradient>
    <linearGradient id="bgSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="capSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#bce8ff"/>
      <stop offset="55%"  stop-color="#7cc1e8"/>
      <stop offset="100%" stop-color="#4a85b4"/>
    </linearGradient>
    <linearGradient id="capFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fffaf0"/>
      <stop offset="55%"  stop-color="#fff1d8"/>
      <stop offset="100%" stop-color="#f4d7b0"/>
    </linearGradient>
    <linearGradient id="capFaceGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff9ec7"/>
      <stop offset="55%"  stop-color="#ff5e9b"/>
      <stop offset="100%" stop-color="#c83972"/>
    </linearGradient>
    <linearGradient id="heartGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fafbfc"/>
      <stop offset="55%"  stop-color="#cbd0d6"/>
      <stop offset="100%" stop-color="#8b929a"/>
    </linearGradient>
    <linearGradient id="duckBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff3a8"/>
      <stop offset="55%"  stop-color="#ffd84a"/>
      <stop offset="100%" stop-color="#d8a510"/>
    </linearGradient>
    <linearGradient id="duckBeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffb04a"/>
      <stop offset="100%" stop-color="#e07810"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#bce8ff" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="capShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgSheen)"/>

  <!-- Background bubbles (lots — bath maxxx) -->
  <g>
    <circle cx="120" cy="240" r="48" fill="url(#bubble)"/>
    <circle cx="116" cy="232" r="12" fill="#ffffff" opacity="0.9"/>
    <circle cx="220" cy="160" r="32" fill="url(#bubble)"/>
    <circle cx="216" cy="154" r="8"  fill="#ffffff" opacity="0.9"/>
    <circle cx="900" cy="200" r="42" fill="url(#bubble)"/>
    <circle cx="894" cy="192" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="820" cy="120" r="26" fill="url(#bubble)"/>
    <circle cx="816" cy="116" r="6"  fill="#ffffff" opacity="0.9"/>
    <circle cx="970" cy="500" r="28" fill="url(#bubble)"/>
    <circle cx="60"  cy="500" r="34" fill="url(#bubble)"/>
    <circle cx="56"  cy="494" r="8"  fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fff8d8">
    <path d="M 168 360 l 8 -36 l 8 36 l 36 8 l -36 8 l -8 36 l -8 -36 l -36 -8 z" opacity="0.85"/>
    <path d="M 856 360 l 6 -28 l 6 28 l 28 6 l -28 6 l -6 28 l -6 -28 l -28 -6 z" opacity="0.85"/>
  </g>

  <!-- Drop shadow under keycap -->
  <ellipse cx="512" cy="892" rx="296" ry="22" fill="url(#capShadow)"/>

  <!-- Keycap skirt -->
  <rect x="200" y="328" width="624" height="552" rx="92" ry="92" fill="url(#capSide)"/>
  <rect x="200" y="328" width="624" height="552" rx="92" ry="92"
        fill="none" stroke="#000" stroke-opacity="0.20" stroke-width="2"/>
  <!-- Keycap top face -->
  <rect x="258" y="364" width="508" height="436" rx="68" ry="68" fill="url(#capFace)"/>
  <rect x="258" y="364" width="508" height="436" rx="68" ry="68" fill="url(#capFaceGloss)"/>

  <!-- Heart padlock — shackle -->
  <path d="M 446 580 L 446 502 A 66 66 0 0 1 578 502 L 578 580"
        fill="none" stroke="url(#shackle)" stroke-width="34" stroke-linecap="round"/>

  <!-- Heart body -->
  <path d="M 512 778 C 512 778, 354 678, 354 568 C 354 506, 408 478, 446 504 C 472 522, 494 554, 512 580 C 530 554, 552 522, 578 504 C 616 478, 670 506, 670 568 C 670 678, 512 778, 512 778 Z" fill="url(#heart)"/>
  <path d="M 512 778 C 512 778, 354 678, 354 568 C 354 506, 408 478, 446 504 C 472 522, 494 554, 512 580 C 530 554, 552 522, 578 504 C 616 478, 670 506, 670 568 C 670 678, 512 778, 512 778 Z" fill="url(#heartGloss)" opacity="0.7"/>
  <path d="M 512 778 C 512 778, 354 678, 354 568 C 354 506, 408 478, 446 504 C 472 522, 494 554, 512 580 C 530 554, 552 522, 578 504 C 616 478, 670 506, 670 568 C 670 678, 512 778, 512 778 Z" fill="none" stroke="#7a1c44" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Relaxed face — closed eyes ~~, content smile -->
  <ellipse cx="412" cy="650" rx="28" ry="16" fill="#ff7aa7" opacity="0.55"/>
  <ellipse cx="612" cy="650" rx="28" ry="16" fill="#ff7aa7" opacity="0.55"/>
  <path d="M 438 612 q 12 -10 24 0 q 12 -10 24 0" fill="none" stroke="#3a1530" stroke-width="9" stroke-linecap="round"/>
  <path d="M 538 612 q 12 -10 24 0 q 12 -10 24 0" fill="none" stroke="#3a1530" stroke-width="9" stroke-linecap="round"/>
  <path d="M 488 660 q 24 18 48 0" fill="none" stroke="#3a1530" stroke-width="9" stroke-linecap="round"/>

  <!-- Rubber duck on top of keycap (right side) -->
  <g transform="translate(680, 270)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="62" ry="46" fill="url(#duckBody)"/>
    <ellipse cx="0" cy="40" rx="62" ry="46" fill="none" stroke="#a07810" stroke-opacity="0.35" stroke-width="2"/>
    <!-- Head -->
    <circle cx="-30" cy="-8" r="36" fill="url(#duckBody)"/>
    <circle cx="-30" cy="-8" r="36" fill="none" stroke="#a07810" stroke-opacity="0.35" stroke-width="2"/>
    <!-- Beak -->
    <path d="M -64 -8 q -16 6 0 18 q 12 -2 18 -6 z" fill="url(#duckBeak)"/>
    <path d="M -64 -8 q -16 6 0 18 q 12 -2 18 -6 z" fill="none" stroke="#7a3a05" stroke-opacity="0.5" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="-22" cy="-14" r="5" fill="#1a0d05"/>
    <circle cx="-20" cy="-16" r="2" fill="#fff" opacity="0.9"/>
    <!-- Tail -->
    <path d="M 50 24 q 22 -8 26 6 q -10 4 -22 4 z" fill="url(#duckBody)"/>
  </g>

  <!-- Foam piling at the bottom of the keycap — wavy band -->
  <g>
    <path d="M 160 820 q 40 -50 90 -10 q 40 -45 90 -8 q 50 -55 100 -8 q 50 -55 100 -8 q 50 -55 100 -8 q 40 -45 90 -8 q 40 -50 90 -10 L 860 880 L 160 880 Z"
          fill="#ffffff" opacity="0.85"/>
    <circle cx="220" cy="800" r="22" fill="#ffffff" opacity="0.95"/>
    <circle cx="216" cy="794" r="6"  fill="#ffffff"/>
    <circle cx="380" cy="784" r="28" fill="#ffffff" opacity="0.95"/>
    <circle cx="376" cy="778" r="7"  fill="#ffffff"/>
    <circle cx="540" cy="780" r="32" fill="#ffffff" opacity="0.95"/>
    <circle cx="534" cy="774" r="8"  fill="#ffffff"/>
    <circle cx="690" cy="788" r="26" fill="#ffffff" opacity="0.95"/>
    <circle cx="686" cy="782" r="7"  fill="#ffffff"/>
    <circle cx="800" cy="804" r="20" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Foreground sparkles -->
  <g fill="#ffffff">
    <path d="M 312 414 l 5 -22 l 5 22 l 22 5 l -22 5 l -5 22 l -5 -22 l -22 -5 z" opacity="0.95"/>
    <path d="M 760 720 l 4 -18 l 4 18 l 18 4 l -18 4 l -4 18 l -4 -18 l -18 -4 z" opacity="0.85"/>
  </g>
</svg>
